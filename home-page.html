<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="author" content="Maisela Manhla Madise" />
  <meta name="description" content="Discover local businesses and attractions in Johannesburg with the Chamber Discovery page." />
  <title>Chamber Discovery</title>
  <link rel="stylesheet" href="styles/chamber.css" />
  <style>
    .membership-level {
      font-weight: normal;
      font-style: italic;
      color: #666;
      font-size: 0.9em;
      margin-left: 8px;
    }
  </style>
</head>
<body>

<header>
  <h1>Chamber Discovery</h1>
  <nav>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="directory.html">Directory</a></li>
      <li><a href="join.html">Join</a></li>
      <li><a href="discovery.html" aria-current="page">Discovery</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>
</header>

<main>
  <section class="discover-grid" aria-label="Discover business and attractions" id="discover-container">
    <!-- Cards will be loaded here -->
  </section>
</main>

<footer>
  <p>&copy; <span id="copyright-year"></span> Johannesburg Chamber of Commerce</p>
  <p>Phone: +27 84 417 8859 | Email: info@joburgchamber.org</p>
  <p>Maisela Manhla Madise | WDD 231</p>
  <p>Last Modification: <span id="last-modified"></span></p>
  <p>Current Time: <span id="current-time"></span></p>
</footer>

<!-- JavaScript -->
<script>
  document.getElementById('copyright-year').textContent = new Date().getFullYear();
  document.getElementById('last-modified').textContent = new Date(document.lastModified).toLocaleString();

  function updateCurrentTime() {
    const now = new Date();
    document.getElementById('current-time').textContent = now.toLocaleTimeString();
  }
  updateCurrentTime();
  setInterval(updateCurrentTime, 1000);

  document.addEventListener('DOMContentLoaded', () => {
    fetch('data/businesses.json')
      .then(response => response.json())
      .then(businesses => {
        const container = document.getElementById('discover-container');
        businesses.forEach((biz, index) => {
          const article = document.createElement('article');
          article.className = 'discover-card';
          article.setAttribute('aria-labelledby', `card${index + 1}-title`);

          article.innerHTML = `
            <figure>
              <img src="images/${biz.imageFileName}" alt="Image of ${biz.name}" />
              <figcaption class="sr-only">${biz.name} image</figcaption>
            </figure>
            <h2 id="card${index + 1}-title">${biz.name} <span class="membership-level">(${biz.membershipLevel} Member)</span></h2>
            <address>${biz.address}</address>
            <p>${biz.description}</p>
            <p>Phone: <a href="tel:${biz.phoneNumber.replace(/\s+/g, '')}">${biz.phoneNumber}</a></p>
            <p>Website: <a href="${biz.websiteURL}" target="_blank" rel="noopener">${biz.websiteURL}</a></p>
            <button onclick="alert('More info about ${biz.name} coming soon!')">Learn More</button>
          `;
          container.appendChild(article);
        });
      })
      .catch(error => {
        console.error('Failed to load businesses.json:', error);
        document.getElementById('discover-container').innerHTML = "<p>Unable to load businesses at this time.</p>";
      });
  });
</script>

</body>
</html>
