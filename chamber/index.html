<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Chamber of Commerce Home Page" />
  <title>Chamber of Commerce</title>
  <link rel="stylesheet" href="styles/chamber.css" />
</head>
<body>
  <header>
    <nav>
      <ul class="nav-menu">
        <li><a href="#">Home</a></li>
        <li><a href="#">Directory</a></li>
        <li><a href="#">Events</a></li>
        <li><a href="#">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <!-- ✅ Hero Section -->
    <section class="hero">
      <div class="hero-content">
        <h1>Welcome to the Chamber</h1>
        <a href="#join" class="cta-button">Join Now</a>
      </div>
    </section>

    <!-- ✅ Current Events -->
    <section class="events">
      <h2>Upcoming Events</h2>
      <ul>
        <li>Business Networking - July 30</li>
        <li>Chamber Breakfast - August 5</li>
        <li>Local Market Day - August 12</li>
      </ul>
    </section>

    <!-- ✅ Weather Section -->
    <section class="weather">
      <h2>Current Weather</h2>
      <div id="weatherContainer">Loading weather...</div>
    </section>

    <!-- ✅ Company Spotlight -->
    <section class="spotlights">
      <h2>Member Spotlights</h2>
      <div id="spotlightContainer" class="spotlight-grid"></div>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 Chamber of Commerce</p>
  </footer>

  <script src="scripts/weather.js" defer></script>
  <script src="scripts/spotlight.js" defer></script>
</body>
</html>
