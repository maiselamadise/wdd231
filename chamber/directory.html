<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Directory of local businesses and organizations in YourCity." />
  <meta name="author" content="Maisela Manhla Madise" />
  <title>Johannesburg Chamber Directory</title>

  <!-- Favicon -->
  <link rel="icon" href="images/favicon.ico" type="image/x-icon" />

  <!-- Open Graph (Facebook) Meta Tags -->
  <meta property="og:title" content="YourCity Chamber of Commerce" />
  <meta property="og:description" content="Connecting businesses and community in YourCity." />
  <meta property="og:image" content="images/social-preview.jpg" />
  <meta property="og:url" content="https://yourdomain.com/chamber/directory.html" />

  <!-- Stylesheets -->
  <link rel="stylesheet" href="styles/bas.css" />
  <link rel="stylesheet" href="styles/chamber.css" />
</head>
<body>
  <header>
    <h1>Johannesburg Chamber of Commerce</h1>
    <nav>
      <button id="menuBtn" aria-label="Toggle Menu" aria-expanded="false">☰</button>
      <ul id="navMenu" class="hidden">
        <li><a href="index.html">Home</a></li>
        <li><a href="directory.html" class="active">Directory</a></li>
        <li><a href="join.html">Join</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <div class="view-toggle">
      <button id="gridView">Grid</button>
      <button id="listView">List</button>
    </div>
    <section id="members" class="grid"></section>
  </main>

  <footer>
    <p>Contact us: info@yourchamber.org | +27 84 417 8859</p>
    <p>Maisela Manhla Madise | WDD 231</p>
    <p>Last Modified: <span id="lastModified"></span></p>
  </footer>

  <!-- Scripts -->
  <script src="scripts/chamber.js"></script>
  <script>
    // Display last modified date
    document.getElementById("lastModified").textContent = document.lastModified;

    // Toggle navigation menu (basic example)
    const menuBtn = document.getElementById("menuBtn");
    const navMenu = document.getElementById("navMenu");

    menuBtn.addEventListener("click", () => {
      const isHidden = navMenu.classList.toggle("hidden");
      menuBtn.setAttribute("aria-expanded", !isHidden);
    });
  </script>
</body>
</html>
