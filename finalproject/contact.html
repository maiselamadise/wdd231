    <button id="theme-toggle" aria-label="Toggle Theme">🌓</button>
  </header>

  <!-- MAIN -->
  <main class="section">
    <h1>Contact Us</h1>
    <p>Use the form below to schedule a service, request a quote, or ask a question.</p>

    <form action="form-action.html" method="POST" novalidate>
      <fieldset>
        <legend>Personal Information</legend>

        <label for="fullname">Full Name</label>
        <input
          type="text"
          id="fullname"
          name="fullname"
          required
          minlength="2"
          maxlength="50"
          placeholder="Your full name"
        />

        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          name="email"
          required
          placeholder="you@example.com"
        />

        <label for="phone">Phone Number</label>
        <input
          type="tel"
          id="phone"
          name="phone"
          placeholder="Optional"
          pattern="^\+?[0-9\s\-]{7,15}$"
          title="Phone number should be between 7 and 15 digits, optional +, spaces, or dashes"
        />
      </fieldset>

      <fieldset>
        <legend>Service Details</legend>

        <label for="service">Select Service</label>
        <select id="service" name="service" required>
          <option value="">-- Choose a service --</option>
          <option value="installation">Smart AC Installation</option>
          <option value="repair">Repair & Maintenance</option>
          <option value="energy-audit">Energy Audit</option>
          <option value="eco-upgrade">Eco-Friendly Upgrade</option>
        </select>

        <label for="date">Preferred Date</label>
        <input
          type="date"
          id="date"
          name="date"
          required
          min=""
        />

        <label for="message">Additional Details</label>
        <textarea
          id="message"
          name="message"
          rows="5"
          placeholder="Tell us anything else you'd like us to know."
        ></textarea>
      </fieldset>

      <button type="submit" class="btn-primary">Submit Request</button>
    </form>
  </main>
